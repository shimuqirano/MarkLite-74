<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MarkLite - 轻量Markdown预览</title>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;display:flex;font-family:system-ui}
#edit{width:50%;padding:16px;border:none;outline:none;font-size:14px;line-height:1.5}
#preview{width:50%;padding:16px;overflow:auto;border-left:1px solid #ccc}
#preview h1,h2,h3{margin:12px 0}
#preview pre{background:#f5f5f5;padding:8px;border-radius:4px;overflow-x:auto}
#preview table{border-collapse:collapse;width:100%}
#preview td,th{border:1px solid #ddd;padding:4px}
</style>
</head>
<body>
<textarea id="edit" placeholder="在这里输入Markdown..."></textarea>
<div id="preview"></div>
<script>
const md=window.markdownit();
const edit=document.getElementById('edit');
const preview=document.getElementById('preview');
function render(){
  preview.innerHTML=md.render(edit.value);
}
edit.addEventListener('input',render);
edit.value=`# MarkLite
轻量级Markdown在线预览工具
- 支持标题、列表、表格、代码块
- 纯前端，无需后端
\`\`\`js
console.log("hello marklite")
\`\`\`
|名称|说明|
|----|----|
|MarkLite|在线预览|
`;
render();
</script>
</body>
</html>
